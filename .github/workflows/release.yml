name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      # Optional build cache. Set the CACHIX_AUTH_TOKEN repo secret (after
      # creating the huion-keydial-mini-uinput cache on cachix.org) to enable it;
      # the release still works without it.
      - uses: cachix/cachix-action@v16
        with:
          name: huion-keydial-mini-uinput
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        continue-on-error: true

      - name: Build all packages
        run: |
          nix build .
          nix build .#arch-pkg --out-link arch-out
          nix build .#deb-pkg --out-link deb-out
          nix build .#rpm-pkg --out-link rpm-out
          nix build .#source-tarball --out-link source-out

      - name: Stage artifacts
        run: |
          mkdir -p artifacts
          cp arch-out/*.pkg.tar.zst artifacts/
          cp deb-out/*.deb artifacts/
          cp rpm-out/*.rpm artifacts/
          cp source-out/*.tar.gz artifacts/

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            artifacts/huion-keydial-mini-driver-*.pkg.tar.zst
            artifacts/huion-keydial-mini-driver_*.deb
            artifacts/huion-keydial-mini-driver-*.rpm
            artifacts/huion-keydial-mini-driver-*.tar.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distro-packages
          path: artifacts/
          retention-days: 90
