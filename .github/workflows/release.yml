name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.2.2)'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.2.2) when called from another workflow'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v16
        with:
          name: huion-keydial-mini-uinput
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build all packages
        run: |
          nix build .
          nix build .#arch-pkg --out-link arch-out
          nix build .#deb-pkg --out-link deb-out
          nix build .#rpm-pkg --out-link rpm-out
          nix build .#source-tarball --out-link source-out

      - name: Stage artifacts
        run: |
          mkdir -p artifacts
          cp arch-out/*.pkg.tar.zst artifacts/
          cp deb-out/*.deb artifacts/
          cp rpm-out/*.rpm artifacts/
          cp source-out/*.tar.gz artifacts/

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ inputs.tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            artifacts/huion-keydial-mini-driver-*.pkg.tar.zst
            artifacts/huion-keydial-mini-driver_*.deb
            artifacts/huion-keydial-mini-driver-*.rpm
            artifacts/huion-keydial-mini-driver-*.tar.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distro-packages
          path: artifacts/
          retention-days: 90
